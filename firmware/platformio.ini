; Edge agentic IoT framework: ESP32 firmware (S2a).
;   pio run                     builds every example for esp32dev
;   pio test -e native          host unit tests of the pure logic (needs a host C++ compiler; see tools\test.ps1)
; Nothing here flashes a board: there is no upload_port and tools\ never calls `pio run -t upload`.

[platformio]
src_dir = examples
default_envs = light, fan, curtain, dht, relay4, sensors

[esp32_base]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = symlink://esp32-core
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -DFW_VERSION=\"0.1.0\"
    -DCORE_DEBUG_LEVEL=1
extra_scripts = pre:esp32-core/scripts/fw_build_ts.py

[env:light]
extends = esp32_base
build_src_filter = -<*> +<light/>

[env:fan]
extends = esp32_base
build_src_filter = -<*> +<fan/>

[env:curtain]
extends = esp32_base
build_src_filter = -<*> +<curtain/>

[env:dht]
extends = esp32_base
build_src_filter = -<*> +<dht/>

[env:relay4]
extends = esp32_base
build_src_filter = -<*> +<relay4/>

[env:sensors]
extends = esp32_base
build_src_filter = -<*> +<sensors/>

; ---- host tests -----------------------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
lib_deps =
    symlink://esp32-core
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -std=c++17
    -Wall
    -Wno-nullability-completeness
    -DEDGE_NATIVE_TEST
    -DFW_VERSION=\"0.1.0\"
