# Mosquitto 2.x for the edge-agent broker (pi-brain).
# TLS only on 8883; plain 1883 is intentionally NOT configured.
# Per-node users/roles/ACLs come from the dynamic-security plugin.

listener 8883
protocol mqtt
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
tls_version tlsv1.2

allow_anonymous false

# dynamic-security: the plugin owns authn + authz. No password_file / acl_file.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence true
persistence_location /mosquitto/data/

max_packet_size 20480
log_dest stdout
log_type error
log_type warning
log_type notice
