# chrony on pi-brain: sync from the internet, serve the LAN so ESP32s get a valid clock for TLS.
# Install on the Pi (Debian/Raspberry Pi OS): sudo apt install chrony
# Then place this as /etc/chrony/conf.d/edge-agent.conf (or merge into /etc/chrony/chrony.conf)
# and: sudo systemctl restart chrony

# Upstream (internet). The default Debian config already has a pool; keep one of these only.
pool pool.ntp.org iburst

# Serve the home LAN where the ESP32s live. CHANGE to your subnet.
allow 192.168.1.0/24

# If the internet is down, keep serving the Pi's own (free-running) time so the LAN stays consistent.
# ESP32s then still get a plausible time, but certificate dates are only meaningful if the Pi was synced before.
local stratum 10

# Step the clock at boot if it is off (Pi has no RTC).
makestep 1.0 3

# Verify:  chronyc tracking ; chronyc clients     Firewall: allow UDP 123 from the LAN.
