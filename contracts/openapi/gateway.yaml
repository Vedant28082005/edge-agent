openapi: 3.1.0
info:
  title: Edge Agent Gateway API
  version: 2.12.0
  description: |
    User-facing API served by the gateway (pi-brain :8000, HTTPS via `tailscale serve`).
    Auth: JWT access + refresh. Roles: admin, member, guest.
    The /admin/* section is separate and role `admin` only (403 otherwise). None of it is
    reachable from the LLM or the MCP tools. Every admin action is audit-logged.
    Changing this file requires bumping info.version.
servers:
  - url: https://pi-brain.tailnet.ts.net
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: devices
  - name: scenes
  - name: chat
  - name: system
  - name: automations
    description: Rules engine API (contracts/automations.md). Admin and member; guests get 403 on every route here.
  - name: admin
    description: Admin role only. Device management and user management.
  - name: internal
    description: SERVICE-TO-SERVICE ONLY. Never exposed on the public listener or through tailscale serve. Not for clients, apps or the LLM.
paths:
  /auth/login:
    post:
      tags: [auth]
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string, maxLength: 64}
                password: {type: string, maxLength: 256, writeOnly: true}
      responses:
        '200': {description: Tokens, content: {application/json: {schema: {$ref: '#/components/schemas/TokenPair'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/refresh:
    post:
      tags: [auth]
      security: []
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string}
      responses:
        '200': {description: Tokens, content: {application/json: {schema: {$ref: '#/components/schemas/TokenPair'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /devices:
    get:
      tags: [devices]
      operationId: listDevices
      description: Read-only list of endpoints visible to the caller (guests see limited rooms).
      parameters:
        - {name: room, in: query, schema: {type: string}}
        - {name: type, in: query, schema: {$ref: '#/components/schemas/EndpointType'}}
      responses:
        '200': {description: Endpoints, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Endpoint'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /devices/{endpoint_id}/set:
    post:
      tags: [devices]
      operationId: setDeviceState
      parameters:
        - {$ref: '#/components/parameters/EndpointId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capability, value]
              properties:
                capability: {type: string}
                value: {oneOf: [{type: boolean}, {type: number}, {type: string}]}
                confirmation_token: {type: string, description: Single-use token from POST /confirmations. Required for risk:confirm endpoints.}
      responses:
        '200': {description: Result, content: {application/json: {schema: {$ref: '#/components/schemas/SetResult'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: |
            Nothing executed: `confirmation_required` (risk:confirm without a valid token) or `endpoint_offline`.
            For `confirmation_required` the body is a `ConfirmationRequired`: a server-built `summary` (clients show it
            verbatim, no client wording), the exact `action` to send to `POST /confirmations` (direct flow) and its
            `action_hash`. Other 409s keep the plain `Error` shape.
          content: {application/json: {schema: {anyOf: [{$ref: '#/components/schemas/ConfirmationRequired'}, {$ref: '#/components/schemas/Error'}]}}}
        '502': {$ref: '#/components/responses/BadGateway'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /scenes:
    get:
      tags: [scenes]
      operationId: listScenes
      responses:
        '200': {description: Scenes, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Scene'}}}}}
    post:
      tags: [scenes]
      operationId: createScene
      description: Admin, or member for rooms they can access.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SceneInput'}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Scene'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /scenes/{scene_id}:
    parameters:
      - {name: scene_id, in: path, required: true, schema: {type: string}}
    put:
      tags: [scenes]
      operationId: updateScene
      description: Admin any scene; member own scenes only.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SceneInput'}}}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Scene'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    delete:
      tags: [scenes]
      operationId: deleteScene
      responses:
        '204': {description: Deleted}
        '403': {$ref: '#/components/responses/Forbidden'}
  /scenes/{scene_id}/run:
    post:
      tags: [scenes]
      operationId: runScene
      description: Guests may run assigned scenes only.
      parameters:
        - {name: scene_id, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmation_token: {type: string, description: Single-use token from POST /confirmations. Required for risk:confirm endpoints.}
      responses:
        '200': {description: Per-action results, content: {application/json: {schema: {$ref: '#/components/schemas/SceneRunResult'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Nothing executed; risk:confirm actions need a confirmation token, content: {application/json: {schema: {$ref: '#/components/schemas/SceneRunResult'}}}}
        '502': {$ref: '#/components/responses/BadGateway'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /confirmations:
    post:
      tags: [devices]
      operationId: mintConfirmation
      description: |
        Mints a confirmation token when the user approves a `risk: confirm` action in the UI.
        The token is opaque, single-use, bound to the caller's user id and to the exact action
        (SHA-256 of the canonical action JSON, see mcp-tools.md), and expires after 60 s (default TTL; server-configurable up to 300 s). Guests can never mint one.
        Two flows:
        * Agent flow: send `request_id` from the `confirmation_request` SSE event. The gateway verifies that the
          action matches the pending request and hands the token to the agent executor server-side; the response
          has no token.
        * Direct flow: send `action` for use with POST /devices/{id}/set or /scenes/{id}/run. The response
          contains the token.
        The token is validated and consumed by device-hub through an internal gateway endpoint (not in this file).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - required: [request_id]
                - required: [action]
              properties:
                request_id: {type: string}
                action: {$ref: '#/components/schemas/ConfirmAction'}
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                type: object
                required: [status, expires_at, action_hash]
                properties:
                  status: {type: string, enum: [delivered_to_agent, minted]}
                  confirmation_token: {type: string, description: Present only in the direct flow}
                  action_hash: {type: string}
                  expires_at: {type: integer}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ConfirmationConflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /confirmations/{request_id}/decline:
    post:
      tags: [devices]
      operationId: declineConfirmation
      description: The user who received the pending `confirmation_request` declined it (only that user may; others get 403). Emits `confirmation_declined`; nothing is executed.
      parameters:
        - {name: request_id, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Declined}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ConfirmationConflict'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /confirmations/{request_id}/retry:
    post:
      tags: [devices]
      operationId: retryConfirmation
      description: |
        Retry after `confirmation_declined` or `confirmation_expired`. Creates a NEW confirmation request
        (new request_id, fresh TTL) for the same blocked action, re-validated against the live registry.
        It never executes anything and never reuses an old token. There is no automatic re-prompt; only this
        explicit user action creates a new request.

        Only the user who received the original request may retry it. There is NO admin override: any other
        caller, including an admin, gets 403 and must start their own request.
      parameters:
        - {name: request_id, in: path, required: true, schema: {type: string}}
      responses:
        '202':
          description: New request created; it arrives as a `confirmation_request` event / WebSocket message
          content: {application/json: {schema: {type: object, required: [request_id], properties: {request_id: {type: string}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ConfirmationConflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /chat:
    post:
      tags: [chat]
      operationId: chat
      description: |
        Proxies the agent `/v1/chat` (`agent-internal.yaml`). Response is an SSE stream; events are defined in agent-events.md.
        Media rules:
        * **Voice becomes a transcript before chat.** `audio_ref` (from `POST /voice`) is resolved by the gateway to the
          stored transcript, which is used as `text`; the agent never receives audio and never sees `audio_ref`.
          If both `text` and `audio_ref` are sent, the transcript is appended to `text` (total still at most 4000 chars).
        * **Images go to the agent inline.** Each `image_refs` entry (from `POST /images`) is resolved by the gateway and
          sent as `images: [{ref, media_type, data_b64}]` in the agent chat body. Refs are single use, owned by the caller,
          and expire (see `/images`). An unknown, expired, used or foreign ref is a 400 `bad_media_ref`.
        Limits: `text` 4000 chars, at most 4 images per turn, 5 MiB per image (see `/images`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id: {type: string, maxLength: 64}
                text: {type: string, maxLength: 4000}
                audio_ref: {type: string, maxLength: 64}
                image_refs: {type: array, maxItems: 4, items: {type: string, maxLength: 64}}
      responses:
        '200':
          description: SSE stream. Each frame's `event:` name and JSON `data:` are described by `SseEvent` (`{event, data}` as parsed by the client).
          content: {text/event-stream: {schema: {type: string}, x-event-schema: {$ref: '#/components/schemas/SseEvent'}}}
        '400': {description: "Malformed body or `bad_media_ref`", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '413': {$ref: '#/components/responses/TooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /voice:
    post:
      tags: [chat]
      operationId: uploadVoice
      description: |
        Audio is proxied to vision-node `/transcribe` (multipart field `audio`). The audio is dropped after transcription;
        only the transcript is kept, under the returned `audio_ref`, for use in `/chat` (single use, 120 s TTL).
        Limits: 10 MiB, container `wav`, `webm`, `m4a` or `aac` (sniffed, not trusted from the Content-Type); other types are 415.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio: {type: string, format: binary}
      responses:
        '200': {description: Transcript, content: {application/json: {schema: {type: object, required: [audio_ref, text], properties: {audio_ref: {type: string}, text: {type: string}}}}}}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /images:
    post:
      tags: [chat]
      operationId: uploadImage
      description: |
        Image upload for the next chat turn(s). Held in memory only (never written to disk), single use, TTL 120 s.
        Limits: 5 MiB per image, `jpeg`, `png` or `webp` (sniffed); other types are 415. At most 8 held images per user and
        32 MiB held in total; beyond that 429 `too_many_uploads`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: {type: string, format: binary}
      responses:
        '200': {description: Reference, content: {application/json: {schema: {type: object, required: [image_ref], properties: {image_ref: {type: string}}}}}}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /memory:
    get:
      tags: [chat]
      operationId: listMyMemories
      description: The caller's own memories only. Guests have none.
      responses:
        '200': {description: Memories, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Memory'}}}}}
  /memory/{memory_id}:
    parameters:
      - {name: memory_id, in: path, required: true, schema: {type: string}}
    put:
      tags: [chat]
      operationId: updateMyMemory
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [text], properties: {text: {type: string, maxLength: 500}}}}}
      responses:
        '200': {description: Updated}
    delete:
      tags: [chat]
      operationId: deleteMyMemory
      responses:
        '204': {description: Deleted}
  # ------------------------------------------------------------ automations (contracts/automations.md)
  /automations:
    get:
      tags: [automations]
      operationId: listAutomations
      x-forbidden-roles: [guest]
      description: |
        Rules visible to the caller. Admin: all. Member: rules they own plus rules whose `rooms` are all inside their rooms.
        Guest: always 403. Filters combine with AND.
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/AutomationStatus'}}
        - {name: created_by, in: query, schema: {$ref: '#/components/schemas/AutomationCreatedBy'}}
      responses:
        '200': {description: Rules, content: {application/json: {schema: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/AutomationRule'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [automations]
      operationId: createAutomation
      x-forbidden-roles: [guest]
      description: |
        Admin or member; guest never (403). Every endpoint the rule reads or acts on must be in the caller's rooms
        (403 `out_of_scope`; a member cannot create room-less rules). A `set_state` action on a
        `risk: confirm` endpoint is refused (409 `confirm_endpoint_not_allowed`): such a rule can only `notify`. Capability,
        type and range are validated against the live registry (400 `bad_rule`). At most 100 rules in total (409 `rule_limit`).
        `source: user` creates the rule `approved` (the caller is the approver). `source: llm_proposal` is for saving a rule
        the LLM proposed as JSON in its reply: the rule is stored with `created_by: llm`, `status: proposed` and **cannot run
        until a user approves it** (`POST /automations/{rule_id}/approve`). The caller can never choose `status` or `created_by`.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AutomationRuleInput'}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/AutomationRule'}}}}
        '400': {description: "Invalid rule (`bad_rule`)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: "`confirm_endpoint_not_allowed` or `rule_limit`", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /automations/{rule_id}:
    parameters:
      - {$ref: '#/components/parameters/RuleId'}
    get:
      tags: [automations]
      operationId: getAutomation
      x-forbidden-roles: [guest]
      responses:
        '200': {description: Rule, content: {application/json: {schema: {$ref: '#/components/schemas/AutomationRule'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [automations]
      operationId: updateAutomation
      x-forbidden-roles: [guest]
      description: |
        Admin any rule; member only rules they own and only inside their rooms (re-checked now). Same validation as create.
        **Any edit of an `approved` rule resets it to `proposed`, `enabled: false`, and clears the approval**: edited content
        never runs on the strength of an earlier approval. `created_by` is unchanged.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AutomationRuleInput'}}}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/AutomationRule'}}}}
        '400': {description: "`bad_rule`", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: "`confirm_endpoint_not_allowed`", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    delete:
      tags: [automations]
      operationId: deleteAutomation
      x-forbidden-roles: [guest]
      description: Admin any rule; member own rules only. Run history is kept (marked `rule_deleted`) for audit.
      responses:
        '204': {description: Deleted}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /automations/{rule_id}/approve:
    parameters:
      - {$ref: '#/components/parameters/RuleId'}
    post:
      tags: [automations]
      operationId: approveAutomation
      x-forbidden-roles: [guest]
      description: |
        `proposed` or `disabled` -> `approved`, `enabled: true`. Only a **user** can call this: admin, or member for a rule whose
        rooms are all inside their rooms. Guest never (403); no service secret and no agent route exists for it. The gateway
        re-validates the rule against the live registry first (nothing changes on failure) and records
        `approved_by` / `approved_at`. A broken rule cannot be approved (409 `rule_broken`). Approval does not bypass the
        `risk: confirm` ban (409 `confirm_endpoint_not_allowed`, re-checked here because risk levels can change).
      responses:
        '200': {description: Approved, content: {application/json: {schema: {$ref: '#/components/schemas/AutomationRule'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: "`rule_broken` or `confirm_endpoint_not_allowed`", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /automations/{rule_id}/disable:
    parameters:
      - {$ref: '#/components/parameters/RuleId'}
    post:
      tags: [automations]
      operationId: disableAutomation
      x-forbidden-roles: [guest]
      description: "Sets `status: disabled`, `enabled: false`. Admin any rule; member rules they own or that are inside their rooms. Idempotent."
      responses:
        '200': {description: Disabled, content: {application/json: {schema: {$ref: '#/components/schemas/AutomationRule'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /automations/{rule_id}/runs:
    parameters:
      - {$ref: '#/components/parameters/RuleId'}
    get:
      tags: [automations]
      operationId: listAutomationRuns
      x-forbidden-roles: [guest]
      description: Run history of one rule, newest first, retained 30 days. Same visibility as the rule. Pagination by opaque `cursor`; `limit` default 50, max 200.
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 256}}
      responses:
        '200': {description: One page, content: {application/json: {schema: {$ref: '#/components/schemas/AutomationRunPage'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /notifications:
    get:
      tags: [automations]
      operationId: listNotifications
      x-forbidden-roles: [guest]
      description: |
        Persisted notifications (automation and system), newest first, retained 30 days, filtered by the caller's role and rooms
        (a member sees only those about endpoints in their rooms or rules they own; admin sees all). Guests get 403.
        The same objects are pushed live as WebSocket `automation_notification`.
      parameters:
        - {name: unread, in: query, schema: {type: boolean, default: false}}
        - {name: rule_id, in: query, schema: {$ref: '#/components/schemas/RuleId'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 256}}
      responses:
        '200': {description: One page, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /notifications/read:
    post:
      tags: [automations]
      operationId: markNotificationsRead
      x-forbidden-roles: [guest]
      description: Marks the caller's own read state (per user, not global).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [notification_ids]
              properties:
                notification_ids: {type: array, minItems: 1, maxItems: 200, uniqueItems: true, items: {$ref: '#/components/schemas/NotificationId'}}
      responses:
        '204': {description: Marked}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/automations/kill-switch:
    get:
      tags: [admin]
      operationId: adminGetAutomationKillSwitch
      x-required-role: admin
      responses:
        '200': {description: State, content: {application/json: {schema: {$ref: '#/components/schemas/AutomationKillSwitch'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [admin]
      operationId: adminSetAutomationKillSwitch
      x-required-role: admin
      description: |
        Global kill switch. `automations_enabled: false` makes the engine execute nothing at all: no `set_state`, no `notify`
        (triggers are not even evaluated; the engine emits one `kill_switch` notification). Rules keep their status.
        Takes effect before the next action starts; an action already sent is not recalled. The state is persisted and
        **survives restarts**; the default on first boot is enabled. Audit-logged with the admin's user id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [automations_enabled]
              properties:
                automations_enabled: {type: boolean}
      responses:
        '200': {description: New state, content: {application/json: {schema: {$ref: '#/components/schemas/AutomationKillSwitch'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /system/health:
    get:
      tags: [system]
      operationId: systemHealth
      responses:
        '200': {description: Node and service health, content: {application/json: {schema: {$ref: '#/components/schemas/SystemHealth'}}}}
  /ws:
    get:
      tags: [system]
      operationId: websocket
      description: |
        WebSocket upgrade. The server pushes JSON messages `{type, ...}` filtered by the caller's role and rooms.
        Types: `state`, `perception`, `scenes_changed`, `registry_changed`, `notification`, `automation_notification`, `automations_changed`, `async_result` (late VLM answer) and the
        confirmation and settle messages below. Settle events are **their own types and are NOT generic notifications**.

        * `confirmation_request` `{request_id, summary, action, action_hash, expires_in_s}`: a `risk: confirm` action awaits this user.
        * `confirmation_declined` `{request_id, summary}`: the user declined; nothing was executed.
        * `action_settled` `{call_id, endpoint_id, capability, value, observed, elapsed_ms}`: a motion reached its target.
        * `action_settle_timeout` `{call_id, endpoint_id, capability, value, observed, settle_s}`: it did not converge (`observed` may be null).
        * `confirmation_expired` `{request_id, summary, reason}`: no answer in time or the token expired; nothing was executed.
        * `scenes_changed` `{scene_id, change}` (`change`: `created|updated|deleted`): a scene was changed. Delivered ONLY to users who
          can see the affected scene (admins; members and guests only when the scene's room selectors and assignments make it
          visible to them, evaluated at delivery time; for `deleted`, by visibility just before deletion); everyone else gets nothing.
          The message carries no scene content: the client refetches `GET /scenes`.
        * `notification` `{level, text}` is for everything else (e.g. `level: action_blocked`).
        * `automation_notification` = a persisted `Notification` (`notification_id, ts, level, source, rule_id?, endpoint_id?, text`) from the rules engine, the same object `GET /notifications` lists. Delivered to admins and to members who can see the rule or the endpoint; never to guests.
        * `automations_changed` `{rule_id, change, automations_enabled?}` (`change`: `created|updated|deleted|approved|disabled|broken|kill_switch`): carries no rule content, clients refetch `GET /automations`. Same visibility as the rule; `kill_switch` goes to admins and members.
        Payloads match `agent-events.md`. Every message is exactly one member of the `WsMessage` schema (discriminator `type`),
        so clients can generate types from it; `state` is `{type, endpoint_id, values, ts}`.

        **Auth: the JWT is NEVER sent in the URL (no `?token=`, no path segment): URLs end up in proxy and access logs.**
        Obtain a ticket with `POST /ws/ticket` (single use, 30 s TTL, bound to the user) and pass it on connect, in the `Sec-WebSocket-Protocol` header as
        `edge-ticket.<ticket>` or as the first message `{"type":"auth","ticket":"..."}` (the server closes with 4401 if
        no valid ticket arrives within 5 s). A header-capable client may also send `Authorization: Bearer <access JWT>`.
        The connection ends when the access token that created it expires (close 4401); the client refreshes and reconnects.

        **Close code 4429 (rate limited):** the server closes with 4429 when the client exceeds the connection or message rate
        limit (too many connects, tickets or inbound messages). The client must wait before reconnecting (back off, at
        least 5 s, doubling up to 60 s) and must not retry in a tight loop.
      security: []
      responses:
        '101': {description: Switching protocols}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /ws/ticket:
    post:
      tags: [system]
      operationId: createWsTicket
      description: |
        Mints a short-lived ticket for the WebSocket handshake (see `/ws`; the JWT must never go in the URL).
        The ticket is opaque (256-bit random), **single use** (burned on first presentation, valid or not), bound to the
        caller's user id and expires 30 s after minting; it carries no more rights than the caller's current role and
        rooms, which are re-read from the DB when the socket connects. Only its hash is stored. It is never logged.
      responses:
        '200':
          description: Ticket
          content:
            application/json:
              schema:
                type: object
                required: [ticket, expires_in_s]
                properties:
                  ticket: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
                  expires_in_s: {const: 30}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ------------------------------------------------------------ INTERNAL (service-to-service only)
  # Everything below is on a separate internal listener, NOT on the public gateway port 8000:
  #   * unix socket /run/edge-agent/gateway-internal.sock (preferred), or
  #   * http://127.0.0.1:8001 bound to loopback only.
  # The public listener must answer 404 for any /internal/* path. Callers authenticate with a per-service secret
  # in the X-Service-Secret header, never with a user JWT. ONE SECRET PER CALLING SERVICE, each scoped to the
  # operations that service needs (one OpenAPI security scheme per service, see components.securitySchemes):
  #   * deviceHubSecret : device-hub only. Authorizes /internal/confirmations/consume and nothing else.
  #   * the agent has NO secret for this gateway API and no internal access at all; it cannot mint or consume tokens.
  #     (Calls into device-hub use a different file: openapi/device-hub-internal.yaml.)
  # Secret files: /etc/edge-agent/secrets/<service>.secret, mode 600, owned by THAT service's user (256-bit random,
  # base64). The gateway cannot read them; it holds only a SHA-256 verifier per service in
  # /etc/edge-agent/secrets/verifiers/<service>.sha256 (mode 600, owned by the gateway user) and compares in
  # constant time. A secret is read from its file, never from env vars or argv, and never logged.
  /internal/confirmations/consume:
    servers:
      - url: http://127.0.0.1:8001
        description: Loopback-only internal listener
      - url: http+unix://%2Frun%2Fedge-agent%2Fgateway-internal.sock
        description: Unix socket (preferred)
    post:
      tags: [internal]
      operationId: internalConsumeConfirmation
      x-internal-callers: [device-hub]
      security:
        - deviceHubSecret: []
      description: |
        INTERNAL. Called by device-hub just before it executes a `risk: confirm` action.
        Atomically validates and consumes a confirmation token, failing closed. The decision is ONE atomic
        operation: `UPDATE tokens SET used=1 WHERE token_hash=? AND user_id=? AND used=0 AND expires_at>? RETURNING
        action_hash`. If it affects no row the call is denied. If it affects one row the token is now burned, and
        the returned `action_hash` is compared with the request's: equal means granted, different means
        `hash_mismatch`. Two concurrent calls can therefore never both succeed.
        Only the gateway mints tokens (POST /confirmations); tokens are stored only as SHA-256 hashes.

        Denial reasons (HTTP 403, `consumed: false`):
        * `unknown`: no such token, or the token belongs to a different user (indistinguishable on purpose).
          A wrong-user attempt does NOT burn the token, so a caller cannot destroy someone else's approval.
        * `expired`: past `expires_at` (default TTL 60 s from minting, configurable up to 300 s).
        * `used`: already consumed (including a token burned by an earlier `hash_mismatch`).
        * `hash_mismatch`: the right user presented the token for a different action. **The token is burned**
          (fail closed): the approval cannot be reused for another action, and a retry needs a new approval.
        To tell `expired`/`used`/`unknown` apart after a zero-row update, do a read-only lookup; this lookup never
        changes state. Every attempt is audit-logged without the token value.

        The action hash is defined in `mcp-tools.md` ("Canonical action hash") with test vectors in
        `samples/confirmation/hash-vectors.json`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsumeRequest'}
      responses:
        '200':
          description: Token valid and now consumed. The caller may execute the action.
          content: {application/json: {schema: {$ref: '#/components/schemas/ConsumeGranted'}}}
        '403':
          description: Denied. The caller must NOT execute the action.
          content: {application/json: {schema: {$ref: '#/components/schemas/ConsumeDenied'}}}
        '401': {description: Missing or wrong X-Service-Secret (or a secret not scoped to this operation), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

  # ------------------------------------------------------------ /admin/* (admin only)
  /admin/provision-sessions:
    post:
      tags: [admin]
      operationId: adminCreateProvisionSession
      x-required-role: admin
      description: Creates the node's MQTT user and role (dynsec) and returns the BLE bundle. Pending sessions expire after about 10 min and are cleaned up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_id]
              properties:
                node_id: {$ref: '#/components/schemas/NodeId'}
                wifi_profile: {type: string, description: Saved profile name, alternative to inline wifi}
                wifi:
                  type: object
                  required: [ssid, password]
                  properties:
                    ssid: {type: string, maxLength: 32}
                    password: {type: string, maxLength: 64, writeOnly: true}
      responses:
        '201': {description: Session with bundle, content: {application/json: {schema: {$ref: '#/components/schemas/ProvisionSession'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/nodes:
    get:
      tags: [admin]
      operationId: adminListNodes
      x-required-role: admin
      responses:
        '200': {description: Nodes, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Node'}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/nodes/{node_id}/approve:
    post:
      tags: [admin]
      operationId: adminApproveNode
      x-required-role: admin
      description: Name and place each announced endpoint; the hub assigns permanent endpoint_ids.
      parameters:
        - {$ref: '#/components/parameters/NodeId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoints]
              properties:
                endpoints:
                  type: array
                  items:
                    type: object
                    required: [local_id, name, room]
                    properties:
                      local_id: {type: string}
                      name: {type: string, maxLength: 48}
                      room: {type: string, maxLength: 48}
                      aliases: {type: array, maxItems: 8, items: {type: string, maxLength: 48}}
                      tags: {$ref: '#/components/schemas/Tags'}
                      risk: {$ref: '#/components/schemas/Risk'}
      responses:
        '200': {description: Approved endpoints, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Endpoint'}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/nodes/{node_id}/identify:
    post:
      tags: [admin]
      operationId: adminIdentifyNode
      x-required-role: admin
      parameters:
        - {$ref: '#/components/parameters/NodeId'}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                duration_s: {type: integer, minimum: 1, maximum: 60, default: 10}
      responses:
        '202': {description: Command sent}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/nodes/{node_id}/unprovision:
    post:
      tags: [admin]
      operationId: adminUnprovisionNode
      x-required-role: admin
      parameters:
        - {$ref: '#/components/parameters/NodeId'}
      responses:
        '202': {description: Command sent}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/nodes/{node_id}:
    delete:
      tags: [admin]
      operationId: adminForgetNode
      x-required-role: admin
      description: |
        Forget. Without confirm=true returns 409 with the usage list ("2 scenes, 1 automation").
        With confirm=true: deletes the MQTT user and role (real revocation), clears retained topics,
        soft-deletes registry rows and marks dependent scenes and automations broken.
      parameters:
        - {$ref: '#/components/parameters/NodeId'}
        - {name: confirm, in: query, schema: {type: boolean, default: false}}
      responses:
        '204': {description: Forgotten}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Usage list, content: {application/json: {schema: {$ref: '#/components/schemas/ForgetUsage'}}}}
  /admin/endpoints/{endpoint_id}:
    patch:
      tags: [admin]
      operationId: adminPatchEndpoint
      x-required-role: admin
      description: Rename, room, aliases, tags, risk, enable/disable. The id never changes. `tags` replaces the whole tag list (admin-set labels, never part of the announce).
      parameters:
        - {$ref: '#/components/parameters/EndpointId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                name: {type: string, maxLength: 48}
                room: {type: string, maxLength: 48}
                aliases: {type: array, maxItems: 8, items: {type: string, maxLength: 48}}
                tags: {$ref: '#/components/schemas/Tags'}
                risk: {$ref: '#/components/schemas/Risk'}
                enabled: {type: boolean}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Endpoint'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/endpoints/{endpoint_id}/rebind:
    post:
      tags: [admin]
      operationId: adminRebindEndpoint
      x-required-role: admin
      description: Hardware swap; the endpoint_id stays.
      parameters:
        - {$ref: '#/components/parameters/EndpointId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_id, local_id]
              properties:
                node_id: {$ref: '#/components/schemas/NodeId'}
                local_id: {type: string}
      responses:
        '200': {description: Rebound, content: {application/json: {schema: {$ref: '#/components/schemas/Endpoint'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/users:
    get:
      tags: [admin]
      operationId: adminListUsers
      x-required-role: admin
      responses:
        '200': {description: Users, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/User'}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [admin]
      operationId: adminCreateUser
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: {type: string, maxLength: 64}
                password: {type: string, minLength: 8, maxLength: 256, writeOnly: true}
                role: {$ref: '#/components/schemas/Role'}
                rooms: {type: array, items: {type: string}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/users/{user_id}:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string}}
    patch:
      tags: [admin]
      operationId: adminPatchUser
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                role: {$ref: '#/components/schemas/Role'}
                rooms: {type: array, items: {type: string}}
                password: {type: string, minLength: 8, maxLength: 256, writeOnly: true}
                disabled: {type: boolean}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    delete:
      tags: [admin]
      operationId: adminDeleteUser
      x-required-role: admin
      responses:
        '204': {description: Deleted}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/scenes/{scene_id}/assignments:
    parameters:
      - {name: scene_id, in: path, required: true, schema: {type: string}}
    get:
      tags: [admin]
      operationId: adminGetSceneAssignments
      x-required-role: admin
      description: Guest users this scene is assigned to. A guest may run a scene only if it is assigned (ARCHITECTURE 4.7).
      responses:
        '200': {description: Assignments, content: {application/json: {schema: {$ref: '#/components/schemas/SceneAssignments'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [admin]
      operationId: adminSetSceneAssignments
      x-required-role: admin
      description: Replaces the whole set of guest users the scene is assigned to. Only users with role `guest` are accepted (400 otherwise); an empty list unassigns everyone. Deleting a scene or a user drops its assignments.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SceneAssignments'}}}
      responses:
        '200': {description: Stored assignments, content: {application/json: {schema: {$ref: '#/components/schemas/SceneAssignments'}}}}
        '400': {description: Unknown user or user is not a guest, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/wifi-profiles:
    get:
      tags: [admin]
      operationId: adminListWifiProfiles
      x-required-role: admin
      description: Saved Wi-Fi profiles for provisioning (`wifi_profile` in POST /admin/provision-sessions). The password is write-only and is NEVER returned by any route.
      responses:
        '200': {description: Profiles without passwords, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/WifiProfile'}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [admin]
      operationId: adminCreateWifiProfile
      x-required-role: admin
      description: Creates or replaces (by name) a profile. The password is stored encrypted, never logged, and never returned.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/WifiProfileInput'}}}
      responses:
        '201': {description: Stored (no password in the reply), content: {application/json: {schema: {$ref: '#/components/schemas/WifiProfile'}}}}
        '400': {description: Invalid profile, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/wifi-profiles/{name}:
    delete:
      tags: [admin]
      operationId: adminDeleteWifiProfile
      x-required-role: admin
      parameters:
        - {name: name, in: path, required: true, schema: {type: string, maxLength: 64}}
      responses:
        '204': {description: Deleted}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /admin/action-log:
    get:
      tags: [admin]
      operationId: adminActionLog
      x-required-role: admin
      description: |
        Paginated log of device actions (who asked for what, through which path, and how it ended), newest first.
        Rows are one per action and are updated in place as it settles (`moving` -> `settled` / `settle_timeout`).
        It holds NO agent turn traces, prompts, chat text, tool arguments, tokens or secrets; traces are a different
        store that this route never reads. Filters combine with AND. Pagination is by opaque `cursor` (stable under
        inserts); `limit` default 50, max 200. Reading the log is itself audit-logged.
      parameters:
        - {name: node_id, in: query, schema: {$ref: '#/components/schemas/NodeId'}}
        - {name: endpoint_id, in: query, schema: {$ref: '#/components/schemas/EndpointId'}}
        - {name: user_id, in: query, schema: {type: string, maxLength: 64}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/ActionStatus'}}
        - {name: from, in: query, schema: {type: integer, minimum: 0}, description: "Unix seconds, inclusive"}
        - {name: to, in: query, schema: {type: integer, minimum: 0}, description: "Unix seconds, exclusive"}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 256}, description: '`next_cursor` of the previous page'}
      responses:
        '200': {description: One page, content: {application/json: {schema: {$ref: '#/components/schemas/ActionLogPage'}}}}
        '400': {description: "Bad filter, `from` after `to`, or bad `cursor` (`bad_request`)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token carrying the role. Every /admin/* path additionally requires role admin.
    deviceHubSecret:
      type: apiKey
      in: header
      name: X-Service-Secret
      description: |
        device-hub's service secret (file /etc/edge-agent/secrets/device-hub.secret, mode 600, owned by the
        device-hub user). Scope: POST /internal/confirmations/consume only. Not valid anywhere else.
  parameters:
    EndpointId: {name: endpoint_id, in: path, required: true, schema: {$ref: '#/components/schemas/EndpointId'}}
    NodeId: {name: node_id, in: path, required: true, schema: {$ref: '#/components/schemas/NodeId'}}
    RuleId: {name: rule_id, in: path, required: true, schema: {$ref: '#/components/schemas/RuleId'}}
  responses:
    Unauthorized: {description: Missing or invalid token, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Role not allowed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ConfirmationConflict:
      description: |
        Conflict on a confirmation request; nothing was executed. `error` is one of
        `request_expired` (TTL passed), `request_already_handled` (approved, declined or retried before),
        `request_not_retryable` (retry of a request that is not declined/expired, or created by a non-user trigger), and
        `action_changed` (the action now resolves differently than when the request was issued, e.g. a scene's risky
        targets changed, the endpoint was re-risked or disabled; the stored action hash no longer matches. The user must
        start a new request).
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    TooLarge: {description: "Body or upload over the limit (`too_large`). Also returned when an upload has no known Content-Length (no `Content-Length` header, e.g. chunked transfer): the server does not buffer unbounded bodies and rejects with 413 instead of 411", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    UnsupportedMedia: {description: "Media type not accepted (`unsupported_media_type`)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    TooManyRequests:
      description: Rate or quota limit (`rate_limited`, `too_many_uploads`). Always sets Retry-After (seconds).
      headers:
        Retry-After: {schema: {type: integer, minimum: 1}, description: Seconds to wait before retrying}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    BadGateway: {description: "An upstream (device-hub, agent, vision-node) answered with an error or an unusable reply (`upstream_error`, `vision_unavailable`)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    GatewayTimeout: {description: "An upstream did not answer in time (`upstream_timeout`)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
        message: {type: string}
    TokenPair:
      type: object
      required: [access_token, refresh_token, role]
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        role: {$ref: '#/components/schemas/Role'}
    Role: {type: string, enum: [admin, member, guest]}
    Risk: {type: string, enum: [normal, confirm]}
    NodeId: {type: string, pattern: '^esp32-[0-9a-f]{12}$'}
    EndpointId: {type: string, pattern: '^ep_[0-9a-f]{8}$'}
    Tag: {type: string, minLength: 1, maxLength: 24, pattern: '^[a-z0-9_-]+$'}
    Tags:
      type: array
      maxItems: 8
      uniqueItems: true
      description: Admin-set labels on an endpoint, used by scene selectors (`tag`). Not part of the announce; a device can never set or change them.
      items: {$ref: '#/components/schemas/Tag'}
    EndpointType: {type: string, enum: [light, fan, outlet, lock, cover, thermostat, sensor, generic]}
    Capability:
      type: object
      required: [id, kind, type]
      properties:
        id: {type: string}
        kind: {type: string, enum: [actuator, sensor]}
        type: {type: string, enum: [bool, int, float, enum]}
        min: {type: number}
        max: {type: number}
        values: {type: array, items: {type: string}}
        unit: {type: string}
        settle_s: {type: number, minimum: 1, maximum: 120, description: "Motion capabilities only (e.g. `position`): worst-case seconds to reach a target, as announced. A set on it answers `status: moving` and the result arrives as `action_settled` / `action_settle_timeout`; the dashboard shows a moving state for up to this long. Absent for instant capabilities and sensors."}
    Endpoint:
      type: object
      required: [endpoint_id, name, room, type, online, enabled, capabilities]
      properties:
        endpoint_id: {$ref: '#/components/schemas/EndpointId'}
        node_id: {$ref: '#/components/schemas/NodeId'}
        local_id: {type: string}
        name: {type: string}
        room: {type: string}
        aliases: {type: array, items: {type: string}}
        tags: {$ref: '#/components/schemas/Tags'}
        type: {$ref: '#/components/schemas/EndpointType'}
        risk: {$ref: '#/components/schemas/Risk'}
        online: {type: boolean}
        enabled: {type: boolean}
        capabilities: {type: array, items: {$ref: '#/components/schemas/Capability'}}
        state: {type: object, additionalProperties: true}
    SetResult:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
        status: {type: string, enum: [done, moving]}
        verified: {type: boolean, description: Read-back matched the target; always false while status is moving (see mcp-tools.md)}
        error: {type: string}
        values: {type: object, additionalProperties: true}
    SceneTargetFixed:
      type: object
      additionalProperties: false
      required: [endpoint_id]
      properties:
        endpoint_id: {$ref: '#/components/schemas/EndpointId'}
    SceneTargetSelector:
      type: object
      description: Selector resolved at run time; fields combine with AND.
      additionalProperties: false
      minProperties: 1
      properties:
        room: {type: string, maxLength: 48}
        type: {$ref: '#/components/schemas/EndpointType'}
        tag: {$ref: '#/components/schemas/Tag'}
    SceneAction:
      type: object
      required: [target, capability, value]
      properties:
        target:
          oneOf:
            - $ref: '#/components/schemas/SceneTargetFixed'
            - $ref: '#/components/schemas/SceneTargetSelector'
        capability: {type: string}
        value: {oneOf: [{type: boolean}, {type: number}, {type: string}]}
    SceneInput:
      type: object
      required: [name, actions]
      properties:
        name: {type: string, maxLength: 48}
        actions: {type: array, minItems: 1, maxItems: 50, items: {$ref: '#/components/schemas/SceneAction'}}
    Scene:
      allOf:
        - $ref: '#/components/schemas/SceneInput'
        - type: object
          required: [scene_id]
          properties:
            scene_id: {type: string}
            owner: {type: string}
            broken: {type: boolean}
    Scalar: {oneOf: [{type: boolean}, {type: number}, {type: string}]}
    ActionStatus: {type: string, enum: [done, moving, settled, settle_timeout, failed, blocked, confirmation_required, declined, expired, denied]}
    ActionLogEntry:
      type: object
      additionalProperties: false
      required: [id, ts, user_id, source, kind, status]
      properties:
        id: {type: integer}
        ts: {type: integer, description: Unix seconds the action was requested}
        user_id: {type: string, description: "Requesting user id; `household` for non-user triggers (automations, perception)"}
        source: {type: string, pattern: '^(direct|agent|scene|admin|automation:ru_[0-9a-f]{8})$', maxLength: 32, description: "Who caused the action. An automation is always logged as `automation:<rule_id>` (never a bare `automation`); `user_id` is then `household`."}
        kind: {type: string, enum: [set_state, run_scene]}
        node_id: {oneOf: [{$ref: '#/components/schemas/NodeId'}, {type: 'null'}]}
        endpoint_id: {oneOf: [{$ref: '#/components/schemas/EndpointId'}, {type: 'null'}]}
        scene_id: {type: [string, 'null'], maxLength: 64}
        capability: {type: [string, 'null'], maxLength: 64}
        value: {oneOf: [{$ref: '#/components/schemas/Scalar'}, {type: 'null'}]}
        status: {$ref: '#/components/schemas/ActionStatus'}
        error: {type: [string, 'null'], maxLength: 64, description: Error code from mcp-tools.md, never free text}
        call_id: {type: [string, 'null'], maxLength: 64}
        elapsed_ms: {type: [integer, 'null'], minimum: 0}
    ActionLogPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/ActionLogEntry'}}
        next_cursor: {type: [string, 'null'], maxLength: 256, description: null on the last page}
    ConfirmationRequired:
      type: object
      additionalProperties: false
      required: [error, summary, action, action_hash]
      properties:
        error: {const: confirmation_required}
        summary: {type: string, maxLength: 200, description: "Server-built from registry labels (admin-set, sanitized), e.g. `Unlock Front door?`. Clients display it as is."}
        action: {$ref: '#/components/schemas/ConfirmAction'}
        action_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        expires_in_s: {type: integer, minimum: 1, maximum: 300, description: TTL a token minted now would have}
    EventAction:
      description: The hashed action as carried by `confirmation_request` (agent-events.md); `run_scene` uses `scene_id` + canonical `actions`.
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, endpoint_id, capability, value]
          properties:
            type: {const: set_state}
            endpoint_id: {$ref: '#/components/schemas/EndpointId'}
            capability: {type: string, maxLength: 64}
            value: {$ref: '#/components/schemas/Scalar'}
        - type: object
          additionalProperties: false
          required: [type, scene_id, actions]
          properties:
            type: {const: run_scene}
            scene_id: {type: string, maxLength: 64}
            actions:
              type: array
              maxItems: 50
              items:
                type: object
                additionalProperties: false
                required: [endpoint_id, capability, value]
                properties:
                  endpoint_id: {$ref: '#/components/schemas/EndpointId'}
                  capability: {type: string, maxLength: 64}
                  value: {$ref: '#/components/schemas/Scalar'}
    SettledFields:
      type: object
      required: [call_id, endpoint_id, capability, value, observed, elapsed_ms]
      properties:
        call_id: {type: string, maxLength: 64}
        endpoint_id: {$ref: '#/components/schemas/EndpointId'}
        capability: {type: string, maxLength: 64}
        value: {$ref: '#/components/schemas/Scalar'}
        observed: {$ref: '#/components/schemas/Scalar'}
        elapsed_ms: {type: integer, minimum: 0}
    SettleTimeoutFields:
      type: object
      required: [call_id, endpoint_id, capability, value, observed, settle_s]
      properties:
        call_id: {type: string, maxLength: 64}
        endpoint_id: {$ref: '#/components/schemas/EndpointId'}
        capability: {type: string, maxLength: 64}
        value: {$ref: '#/components/schemas/Scalar'}
        observed: {oneOf: [{$ref: '#/components/schemas/Scalar'}, {type: 'null'}]}
        settle_s: {type: number, minimum: 1, maximum: 120}
    ConfirmationRequestFields:
      type: object
      required: [request_id, summary, action, action_hash, expires_in_s]
      properties:
        request_id: {type: string, maxLength: 64}
        summary: {type: string, maxLength: 200}
        action: {$ref: '#/components/schemas/EventAction'}
        action_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        expires_in_s: {type: integer, minimum: 1, maximum: 300}
    ConfirmationDeclinedFields:
      type: object
      required: [request_id, summary]
      properties:
        request_id: {type: string, maxLength: 64}
        summary: {type: string, maxLength: 200}
    ConfirmationExpiredFields:
      type: object
      required: [request_id, summary, reason]
      properties:
        request_id: {type: string, maxLength: 64}
        summary: {type: string, maxLength: 200}
        reason: {type: string, enum: [no_response, token_expired]}
    AsyncResultFields:
      type: object
      required: [ref, kind, text, latency_ms]
      properties:
        ref: {type: string, maxLength: 64}
        kind: {type: string, enum: [vision]}
        text: {type: string, maxLength: 4000}
        latency_ms: {type: integer, minimum: 0}
    Route:
      type: string
      enum: [fast, llm, vision, sensor, yolo, vlm]
      description: |
        Scheduler route that produced a reply (ARCHITECTURE 5). `fast` rule/grammar path, `llm` tool-calling loop,
        `sensor` direct `read_sensor`, `yolo` person/object presence, `vlm` VLM question, `vision` legacy umbrella for
        a vision answer that does not say which model (kept for compatibility; new code emits `yolo` / `vlm`).
        Clients MUST treat an unknown value as an opaque label, so a later route is not breaking.
    WsMessage:
      description: "One WebSocket message. Discriminator `type`. Messages are exactly these shapes (no extra properties); adding a type or field is a contract change."
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, endpoint_id, values, ts]
          properties:
            type: {const: state}
            endpoint_id: {$ref: '#/components/schemas/EndpointId'}
            values: {type: object, minProperties: 1, additionalProperties: {$ref: '#/components/schemas/Scalar'}}
            ts: {type: integer, minimum: 1000000000}
        - type: object
          additionalProperties: false
          required: [type, event]
          properties:
            type: {const: perception}
            event: {type: object, additionalProperties: true, description: A perception event (perception-event.schema.json)}
        - type: object
          additionalProperties: false
          required: [type, scene_id, change]
          properties:
            type: {const: scenes_changed}
            scene_id: {type: string, maxLength: 64}
            change: {type: string, enum: [created, updated, deleted]}
        - type: object
          additionalProperties: false
          required: [type, version, endpoint_ids]
          properties:
            type: {const: registry_changed}
            version: {type: integer, minimum: 0}
            endpoint_ids: {type: array, items: {$ref: '#/components/schemas/EndpointId'}}
        - type: object
          additionalProperties: false
          required: [type, level, text]
          properties:
            type: {const: notification}
            level: {type: string, maxLength: 32, description: "Open vocabulary, e.g. `info`, `action_blocked`; unknown levels display as info"}
            text: {type: string, maxLength: 500}
        - type: object
          unevaluatedProperties: false
          allOf:
            - {$ref: '#/components/schemas/NotificationFields'}
            - type: object
              required: [type]
              properties: {type: {const: automation_notification}}
        - type: object
          additionalProperties: false
          required: [type, change]
          properties:
            type: {const: automations_changed}
            rule_id: {oneOf: [{$ref: '#/components/schemas/RuleId'}, {type: 'null'}], description: null for `kill_switch`}
            change: {type: string, enum: [created, updated, deleted, approved, disabled, broken, kill_switch]}
            automations_enabled: {type: boolean, description: "Present with `change: kill_switch`"}
        - type: object
          unevaluatedProperties: false
          allOf:
            - {$ref: '#/components/schemas/AsyncResultFields'}
            - {type: object, required: [type], properties: {type: {const: async_result}}}
        - type: object
          unevaluatedProperties: false
          allOf:
            - {$ref: '#/components/schemas/ConfirmationRequestFields'}
            - {type: object, required: [type], properties: {type: {const: confirmation_request}}}
        - type: object
          unevaluatedProperties: false
          allOf:
            - {$ref: '#/components/schemas/ConfirmationDeclinedFields'}
            - {type: object, required: [type], properties: {type: {const: confirmation_declined}}}
        - type: object
          unevaluatedProperties: false
          allOf:
            - {$ref: '#/components/schemas/ConfirmationExpiredFields'}
            - {type: object, required: [type], properties: {type: {const: confirmation_expired}}}
        - type: object
          unevaluatedProperties: false
          allOf:
            - {$ref: '#/components/schemas/SettledFields'}
            - {type: object, required: [type], properties: {type: {const: action_settled}}}
        - type: object
          unevaluatedProperties: false
          allOf:
            - {$ref: '#/components/schemas/SettleTimeoutFields'}
            - {type: object, required: [type], properties: {type: {const: action_settle_timeout}}}
    SseEnvelope:
      type: object
      required: [seq, req_id]
      properties:
        seq: {type: integer, minimum: 0, description: Monotonic per request}
        req_id: {type: string, maxLength: 64}
    SseEvent:
      description: |
        A `/chat` SSE frame as parsed by the client: `{event, data}` (`event:` line + parsed `data:` JSON). `data` always
        carries `seq` and `req_id`. The confirmation token never appears in any event.
      oneOf:
        - type: object
          additionalProperties: false
          required: [event, data]
          properties:
            event: {const: status}
            data: {allOf: [{$ref: '#/components/schemas/SseEnvelope'}, {type: object, required: [text], properties: {text: {type: string, maxLength: 200}}}]}
        - type: object
          additionalProperties: false
          required: [event, data]
          properties:
            event: {const: tool_call}
            data:
              allOf:
                - {$ref: '#/components/schemas/SseEnvelope'}
                - type: object
                  required: [call_id, tool, args]
                  properties:
                    call_id: {type: string, maxLength: 64}
                    tool: {type: string, enum: [list_devices, get_state, set_state, run_scene, read_sensor]}
                    args: {type: object, additionalProperties: true}
        - type: object
          additionalProperties: false
          required: [event, data]
          properties:
            event: {const: tool_result}
            data:
              allOf:
                - {$ref: '#/components/schemas/SseEnvelope'}
                - type: object
                  required: [call_id, tool, result, ok]
                  properties:
                    call_id: {type: string, maxLength: 64}
                    tool: {type: string, enum: [list_devices, get_state, set_state, run_scene, read_sensor]}
                    result: {type: object, additionalProperties: true}
                    ok: {type: boolean}
        - type: object
          additionalProperties: false
          required: [event, data]
          properties:
            event: {const: token}
            data: {allOf: [{$ref: '#/components/schemas/SseEnvelope'}, {type: object, required: [text], properties: {text: {type: string}}}]}
        - type: object
          additionalProperties: false
          required: [event, data]
          properties:
            event: {const: final}
            data:
              allOf:
                - {$ref: '#/components/schemas/SseEnvelope'}
                - type: object
                  required: [text, route, latency_ms]
                  properties:
                    text: {type: string}
                    route: {$ref: '#/components/schemas/Route'}
                    latency_ms: {type: integer, minimum: 0}
        - type: object
          additionalProperties: false
          required: [event, data]
          properties:
            event: {const: error}
            data:
              allOf:
                - {$ref: '#/components/schemas/SseEnvelope'}
                - type: object
                  required: [code, message]
                  properties:
                    code: {type: string, enum: [llm_busy, vision_unavailable, budget_exceeded, bad_request]}
                    message: {type: string, maxLength: 500}
        - type: object
          additionalProperties: false
          required: [event, data]
          properties:
            event: {const: async_result}
            data: {allOf: [{$ref: '#/components/schemas/SseEnvelope'}, {$ref: '#/components/schemas/AsyncResultFields'}]}
        - type: object
          additionalProperties: false
          required: [event, data]
          properties:
            event: {const: confirmation_request}
            data: {allOf: [{$ref: '#/components/schemas/SseEnvelope'}, {$ref: '#/components/schemas/ConfirmationRequestFields'}]}
        - type: object
          additionalProperties: false
          required: [event, data]
          properties:
            event: {const: confirmation_declined}
            data: {allOf: [{$ref: '#/components/schemas/SseEnvelope'}, {$ref: '#/components/schemas/ConfirmationDeclinedFields'}]}
        - type: object
          additionalProperties: false
          required: [event, data]
          properties:
            event: {const: confirmation_expired}
            data: {allOf: [{$ref: '#/components/schemas/SseEnvelope'}, {$ref: '#/components/schemas/ConfirmationExpiredFields'}]}
        - type: object
          additionalProperties: false
          required: [event, data]
          properties:
            event: {const: action_settled}
            data: {allOf: [{$ref: '#/components/schemas/SseEnvelope'}, {$ref: '#/components/schemas/SettledFields'}]}
        - type: object
          additionalProperties: false
          required: [event, data]
          properties:
            event: {const: action_settle_timeout}
            data: {allOf: [{$ref: '#/components/schemas/SseEnvelope'}, {$ref: '#/components/schemas/SettleTimeoutFields'}]}
    RuleId: {type: string, pattern: '^ru_[0-9a-f]{8}$'}
    NotificationId: {type: string, pattern: '^nt_[0-9a-f]{12}$'}
    AutomationStatus: {type: string, enum: [proposed, approved, disabled]}
    AutomationCreatedBy: {type: string, enum: [user, llm]}
    TimeOfDay: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: "24 h `HH:MM` in the household time zone (a gateway setting)"}
    Weekday: {type: string, enum: [mon, tue, wed, thu, fri, sat, sun]}
    Weekdays: {type: array, minItems: 1, maxItems: 7, uniqueItems: true, items: {$ref: '#/components/schemas/Weekday'}, description: Absent means every day}
    AutomationTrigger:
      description: Closed set. `endpoint_id` is the permanent id; the gateway resolves rooms from it. Scalars are validated against the capability at save time.
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, endpoint_id, capability]
          properties:
            type: {const: device_state_change}
            endpoint_id: {$ref: '#/components/schemas/EndpointId'}
            capability: {type: string, maxLength: 64}
            to: {$ref: '#/components/schemas/Scalar'}
            from: {$ref: '#/components/schemas/Scalar'}
        - type: object
          additionalProperties: false
          required: [type, endpoint_id]
          properties:
            type: {const: device_offline}
            endpoint_id: {$ref: '#/components/schemas/EndpointId'}
            for_s: {type: integer, minimum: 0, maximum: 86400, default: 60, description: Must stay offline this long before firing}
        - type: object
          additionalProperties: false
          required: [type, endpoint_id, capability, value, for_s]
          properties:
            type: {const: duration_in_state}
            endpoint_id: {$ref: '#/components/schemas/EndpointId'}
            capability: {type: string, maxLength: 64}
            value: {$ref: '#/components/schemas/Scalar'}
            for_s: {type: integer, minimum: 10, maximum: 86400}
        - type: object
          additionalProperties: false
          required: [type, at]
          properties:
            type: {const: time_of_day}
            at: {$ref: '#/components/schemas/TimeOfDay'}
            days: {$ref: '#/components/schemas/Weekdays'}
        - type: object
          additionalProperties: false
          required: [type, every_s]
          properties:
            type: {const: schedule}
            every_s: {type: integer, minimum: 60, maximum: 86400}
            between:
              type: object
              additionalProperties: false
              required: [from, to]
              properties:
                from: {$ref: '#/components/schemas/TimeOfDay'}
                to: {$ref: '#/components/schemas/TimeOfDay'}
            days: {$ref: '#/components/schemas/Weekdays'}
    AutomationClause:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, endpoint_id, capability, op, value]
          properties:
            type: {const: device_state}
            endpoint_id: {$ref: '#/components/schemas/EndpointId'}
            capability: {type: string, maxLength: 64}
            op: {type: string, enum: [eq, ne, gt, ge, lt, le]}
            value: {$ref: '#/components/schemas/Scalar'}
        - type: object
          additionalProperties: false
          required: [type, after, before]
          properties:
            type: {const: time_window}
            after: {$ref: '#/components/schemas/TimeOfDay'}
            before: {$ref: '#/components/schemas/TimeOfDay'}
            days: {$ref: '#/components/schemas/Weekdays'}
    AutomationCondition:
      type: object
      additionalProperties: false
      required: [all]
      description: All clauses must hold when the trigger fires (AND only; no nesting, no OR).
      properties:
        all: {type: array, minItems: 1, maxItems: 4, items: {$ref: '#/components/schemas/AutomationClause'}}
    AutomationAction:
      description: |
        Exactly one action. `set_state` is refused for `risk: confirm` endpoints at save, at approval and again at every run
        (on a hit the run is `blocked_confirm` and a notification is sent; nothing executes, no confirmation request is created).
        `text` is author-written plain text (at most 120 chars, no placeholders), shown by clients as text and never put in an LLM prompt.
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, text]
          properties:
            type: {const: notify}
            level: {type: string, enum: [info, warning], default: info}
            text: {type: string, minLength: 1, maxLength: 120}
        - type: object
          additionalProperties: false
          required: [type, endpoint_id, capability, value]
          properties:
            type: {const: set_state}
            endpoint_id: {$ref: '#/components/schemas/EndpointId'}
            capability: {type: string, maxLength: 64}
            value: {$ref: '#/components/schemas/Scalar'}
    AutomationRuleInput:
      type: object
      additionalProperties: false
      required: [name, source, trigger, action, cooldown_s, max_runs_per_day]
      description: Body of create/update. `status`, `created_by`, `owner`, `enabled` and approval fields are server-set and rejected here.
      properties:
        name: {type: string, minLength: 1, maxLength: 48}
        source: {type: string, enum: [user, llm_proposal], description: "`llm_proposal` forces `created_by: llm`, `status: proposed` (ignored on update: `created_by` never changes)"}
        trigger: {$ref: '#/components/schemas/AutomationTrigger'}
        condition: {$ref: '#/components/schemas/AutomationCondition'}
        action: {$ref: '#/components/schemas/AutomationAction'}
        cooldown_s: {type: integer, minimum: 10, maximum: 86400, description: Minimum seconds between two executions of this rule}
        max_runs_per_day: {type: integer, minimum: 1, maximum: 1000, description: Executions per household day (midnight to midnight); further runs are `skipped_daily_limit`}
    AutomationRule:
      type: object
      additionalProperties: false
      required: [rule_id, name, owner, enabled, trigger, action, cooldown_s, max_runs_per_day, status, created_by, created_at, updated_at]
      properties:
        rule_id: {$ref: '#/components/schemas/RuleId'}
        name: {type: string, minLength: 1, maxLength: 48}
        owner: {type: string, maxLength: 64, description: "User id of the user who saved the rule (for `created_by: llm` the user who saved the proposal)"}
        enabled: {type: boolean, description: "True only while `status` is `approved`"}
        trigger: {$ref: '#/components/schemas/AutomationTrigger'}
        condition: {$ref: '#/components/schemas/AutomationCondition'}
        action: {$ref: '#/components/schemas/AutomationAction'}
        cooldown_s: {type: integer, minimum: 10, maximum: 86400}
        max_runs_per_day: {type: integer, minimum: 1, maximum: 1000}
        status: {$ref: '#/components/schemas/AutomationStatus'}
        created_by: {$ref: '#/components/schemas/AutomationCreatedBy'}
        approved_by: {type: string, maxLength: 64, description: User id of the approving user. Required when `status` is `approved`; never a service or `llm`.}
        approved_at: {type: integer, minimum: 1000000000}
        created_at: {type: integer, minimum: 1000000000}
        updated_at: {type: integer, minimum: 1000000000}
        rooms: {type: array, maxItems: 16, uniqueItems: true, items: {type: string, maxLength: 48}, description: Read-only. Rooms of every endpoint the rule reads or acts on, resolved by the gateway.}
        broken: {type: boolean, description: Read-only. Set by the registry re-validation (forgotten or incompatible endpoint, now a risk:confirm target, capability gone). A broken rule never runs.}
      allOf:
        - if: {properties: {status: {const: approved}}, required: [status]}
          then: {required: [approved_by, approved_at], properties: {enabled: {const: true}}}
        - if: {properties: {status: {enum: [proposed, disabled]}}, required: [status]}
          then: {properties: {enabled: {const: false}}}
    AutomationOutcome:
      type: string
      enum: [fired, skipped_condition, skipped_cooldown, skipped_daily_limit, skipped_offline, blocked_confirm, blocked_scope, failed, suppressed_kill_switch]
      description: |
        `fired`: the action was sent (notify: delivered); the final device result is `action_status`. `blocked_confirm`: the target is
        `risk: confirm` (or became so); notification sent, nothing executed. `blocked_scope`: the owner lost access to a room of the
        rule; nothing executed. `suppressed_kill_switch` is recorded only for a trigger that arrived while the switch was off and is
        sampled at most once per rule per hour.
    AutomationRun:
      type: object
      additionalProperties: false
      required: [run_id, rule_id, ts, outcome]
      properties:
        run_id: {type: integer}
        rule_id: {$ref: '#/components/schemas/RuleId'}
        ts: {type: integer, minimum: 1000000000}
        outcome: {$ref: '#/components/schemas/AutomationOutcome'}
        action_status: {oneOf: [{$ref: '#/components/schemas/ActionStatus'}, {type: 'null'}], description: Final status of the `set_state` (same values as the action log); null for notify or when nothing was sent}
        action_log_id: {type: [integer, 'null'], description: "Row in the action log (`source: automation:<rule_id>`)"}
        call_id: {type: [string, 'null'], maxLength: 64}
        error: {type: [string, 'null'], maxLength: 64, description: Error code from mcp-tools.md, never free text}
        rule_deleted: {type: boolean, description: True once the rule no longer exists}
    AutomationRunPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/AutomationRun'}}
        next_cursor: {type: [string, 'null'], maxLength: 256}
    NotificationLevel:
      type: string
      enum: [info, warning, action_blocked, rule_proposed, rule_broken, rule_limit, kill_switch]
      description: "Closed. Clients treat an unknown value as `info`, so a later level is not breaking."
    Notification:
      allOf:
        - $ref: '#/components/schemas/NotificationFields'
      unevaluatedProperties: false
    NotificationFields:
      type: object
      required: [notification_id, ts, level, source, text]
      description: |
        A persisted notification. `text` is server-built or the rule's own `notify` text (at most 500 chars), displayed as plain text,
        never interpreted and never given to an LLM. It carries no secret, token or raw device string; endpoint and rule names are
        admin-set labels, sanitized.
      properties:
        notification_id: {$ref: '#/components/schemas/NotificationId'}
        ts: {type: integer, minimum: 1000000000}
        level: {$ref: '#/components/schemas/NotificationLevel'}
        source: {type: string, pattern: '^(system|automation:ru_[0-9a-f]{8})$', maxLength: 32}
        rule_id: {oneOf: [{$ref: '#/components/schemas/RuleId'}, {type: 'null'}], description: Present exactly when `source` is `automation:<rule_id>`}
        endpoint_id: {oneOf: [{$ref: '#/components/schemas/EndpointId'}, {type: 'null'}]}
        text: {type: string, minLength: 1, maxLength: 500}
        read: {type: boolean, description: For the calling user; absent in WebSocket pushes}
    NotificationPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/Notification'}}
        next_cursor: {type: [string, 'null'], maxLength: 256}
    AutomationKillSwitch:
      type: object
      additionalProperties: false
      required: [automations_enabled]
      properties:
        automations_enabled: {type: boolean}
        changed_by: {type: [string, 'null'], maxLength: 64}
        changed_at: {type: [integer, 'null']}
    ConsumeRequest:
      type: object
      additionalProperties: false
      required: [token, user_id, action_hash]
      properties:
        token: {type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: 256-bit random, base64url without padding}
        user_id: {type: string, minLength: 1, maxLength: 64}
        action_hash: {type: string, pattern: '^[0-9a-f]{64}$', description: Lowercase hex SHA-256 of the canonical action JSON (see mcp-tools.md)}
    ConsumeGranted:
      type: object
      additionalProperties: false
      required: [consumed, action_hash, user_id]
      properties:
        consumed: {const: true}
        action_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        user_id: {type: string}
    ConsumeDenied:
      type: object
      additionalProperties: false
      required: [consumed, reason]
      properties:
        consumed: {const: false}
        reason: {type: string, enum: [expired, used, hash_mismatch, unknown]}
    ConfirmAction:
      oneOf:
        - type: object
          required: [type, endpoint_id, capability, value]
          properties:
            type: {const: set_state}
            endpoint_id: {$ref: '#/components/schemas/EndpointId'}
            capability: {type: string}
            value: {oneOf: [{type: boolean}, {type: number}, {type: string}]}
        - type: object
          required: [type, scene]
          properties:
            type: {const: run_scene}
            scene: {type: string}
    SceneRunResult:
      type: object
      description: |
        If any action targets a risk:confirm endpoint and no valid confirmation_token covers it, NOTHING runs:
        `executed` is false, `status` is needs_confirmation and `needs_confirmation` lists those actions (HTTP 409).
      required: [ok, executed]
      properties:
        ok: {type: boolean}
        executed: {type: boolean}
        scene: {type: string, description: Permanent scene id}
        scene_name: {type: string}
        summary: {type: string, maxLength: 200, description: "With `status: needs_confirmation`: server-built prompt text, shown verbatim (same rule as `ConfirmationRequired`)"}
        action_hash: {type: string, pattern: '^[0-9a-f]{64}$', description: "With `status: needs_confirmation`: canonical hash of `{actions: needs_confirmation, scene_id, type: run_scene}`"}
        error: {type: string, enum: [unknown_scene, scene_broken]}
        status: {type: string, enum: [needs_confirmation]}
        needs_confirmation:
          type: array
          items:
            type: object
            required: [endpoint_id, capability, value]
            properties:
              endpoint_id: {type: string}
              capability: {type: string}
              value: {oneOf: [{type: boolean}, {type: number}, {type: string}]}
        results:
          type: array
          items:
            type: object
            required: [endpoint_id, capability, status]
            properties:
              endpoint_id: {type: string}
              capability: {type: string}
              status: {type: string, enum: [done, moving, skipped_offline, skipped_no_capability, failed]}
              detail: {type: string}
    SceneAssignments:
      type: object
      additionalProperties: false
      required: [user_ids]
      properties:
        user_ids: {type: array, maxItems: 64, uniqueItems: true, items: {type: string, maxLength: 64}, description: Guest user ids}
    WifiProfile:
      type: object
      additionalProperties: false
      required: [name, ssid]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        ssid: {type: string, maxLength: 32}
    WifiProfileInput:
      type: object
      additionalProperties: false
      required: [name, ssid, password]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        ssid: {type: string, maxLength: 32}
        password: {type: string, maxLength: 64, writeOnly: true}
    Memory:
      type: object
      properties:
        memory_id: {type: string}
        text: {type: string}
        updated_at: {type: integer}
    Node:
      type: object
      required: [node_id, status]
      properties:
        node_id: {$ref: '#/components/schemas/NodeId'}
        hw: {type: string}
        fw: {type: string}
        status: {type: string, enum: [pending, online, offline]}
        endpoints: {type: array, items: {$ref: '#/components/schemas/Endpoint'}}
    ProvisionSession:
      type: object
      required: [session_id, bundle, expires_at]
      properties:
        session_id: {type: string}
        expires_at: {type: integer}
        bundle:
          type: object
          description: Plaintext bundle for the BLE client to encrypt and send (see ble-provisioning.md). mqtt.username is the node_id and is also the MQTT client_id; the node uses a clean session. Contains secrets; never log.
          required: [v, wifi, mqtt, ca_pem]
          properties:
            v: {const: 1}
            wifi: {type: object, properties: {ssid: {type: string}, password: {type: string}}}
            mqtt: {type: object, properties: {host: {type: string}, port: {type: integer}, username: {type: string}, password: {type: string}}}
            ntp_host: {type: string}
            ca_pem: {type: string}
    ForgetUsage:
      type: object
      properties:
        scenes: {type: integer}
        automations: {type: integer}
        message: {type: string}
    User:
      type: object
      properties:
        user_id: {type: string}
        username: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        rooms: {type: array, items: {type: string}}
        disabled: {type: boolean}
    SystemHealth:
      type: object
      properties:
        nodes:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              up: {type: boolean}
              mem_available_mb: {type: integer}
              temp_c: {type: number}
              queue_depth: {type: integer}
