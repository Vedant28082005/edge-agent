[project]
name = "device-hub"
version = "0.1.0"
description = "Edge agent device-hub: registry, MQTT bridge, dynsec client, scenes, MCP server"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.1,<3",
    "jsonschema>=4.21",
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "mcp>=1.9,<2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
markers = ["integration: needs the dev broker (docker compose, compose.dev.yml)"]
