[project]
name = "vision-node"
version = "0.1.0"
description = "Edge agent vision-node (pi-vision): Qwen3-VL via llama-server, whisper.cpp, YOLOv8n fallback"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.37",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "pyyaml",
    "pillow>=10.3",
]

[project.optional-dependencies]
yolo = ["numpy>=1.26", "onnxruntime>=1.18"]
dev = ["pytest", "pytest-timeout", "numpy>=1.26"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
